
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College Athlete Planner</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>College Athlete Planner</h1>
    <p>Balance academics, training, and life.</p>
  </header>

  <main>
    <section class="card">
      <h2>Today's Tasks</h2>
      <input id="taskInput" type="text" placeholder="Add an assignment or task">
      <button onclick="addTask()">Add Task</button>
      <ul id="taskList"></ul>
    </section>

    <section class="card">
      <h2>Workout Tracker</h2>
      <input id="workoutInput" type="text" placeholder="Enter today's workout">
      <button onclick="addWorkout()">Add Workout</button>
      <ul id="workoutList"></ul>
    </section>

    <section class="card">
      <h2>Daily Schedule</h2>
      <input id="scheduleInput" type="text" placeholder="Add a class, practice, or event">
      <button onclick="addSchedule()">Add Schedule Item</button>
      <ul id="scheduleList"></ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
